name: Generate Daily Puzzles

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'How many days of puzzles to generate (default: 45)'
        required: false
        default: '45'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and insert puzzles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '45' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime, urllib.request, urllib.error, sys

          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SERVICE_KEY  = os.environ["SUPABASE_SERVICE_KEY"]
          OPENAI_KEY   = os.environ["OPENAI_API_KEY"]
          DAYS_AHEAD   = int(os.environ.get("DAYS_AHEAD", "45"))

          SUPABASE_HEADERS = {
              "apikey": SERVICE_KEY,
              "Authorization": f"Bearer {SERVICE_KEY}",
              "Content-Type": "application/json",
          }

          def supabase_get(path):
              req = urllib.request.Request(
                  f"{SUPABASE_URL}/rest/v1/{path}",
                  headers=SUPABASE_HEADERS,
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # ── 1. Find the last date already scheduled ──────────────────────────
          rows = supabase_get("daily_puzzles?select=date&order=date.desc&limit=1")
          if rows:
              last_date = datetime.date.fromisoformat(rows[0]["date"])
          else:
              last_date = datetime.date.today() - datetime.timedelta(days=1)

          start_date = last_date + datetime.timedelta(days=1)
          end_date   = start_date + datetime.timedelta(days=DAYS_AHEAD - 1)
          count       = DAYS_AHEAD

          print(f"Generating {count} puzzles: {start_date} → {end_date}")

          # ── 2. Fetch the last 365 days of used pairs for deduplication ───────
          one_year_ago = (datetime.date.today() - datetime.timedelta(days=365)).isoformat()
          used_rows = supabase_get(
              f"daily_puzzles?select=start_article,end_article"
              f"&date=gte.{one_year_ago}&order=date.desc&limit=400"
          )
          used_pairs = [
              {"start": r["start_article"], "end": r["end_article"]}
              for r in used_rows
          ]
          print(f"Found {len(used_pairs)} existing pairs to avoid")

          # ── 3. Call OpenAI ───────────────────────────────────────────────────
          used_list_str = "\n".join(
              f"  - {p['start']} → {p['end']}" for p in used_pairs
          ) or "  (none yet)"

          prompt = f"""You are generating puzzle pairs for WikiRace, a daily game where players navigate from a start Wikipedia article to an end article by clicking links.

  Generate exactly {count} new puzzle pairs.

  RULES:
  1. Both articles must be real English Wikipedia articles that actually exist.
  2. The pair must NOT appear in the "already used" list below (either direction).
  3. Pairs should be varied — mix famous people, places, historical events, scientific concepts, pop culture, nature, etc.
  4. The start and end should NOT be obviously closely related (e.g. don't pair "France" with "Paris"). Make it a meaningful challenge.
  5. Avoid very obscure articles that most people wouldn't recognise.

  ALREADY USED PAIRS (do not repeat these):
  {used_list_str}

  Respond with ONLY a JSON array of exactly {count} objects. Each object must have exactly two keys: "start_article" and "end_article". No markdown, no explanation, just the raw JSON array.

  Example format:
  [{{"start_article": "Pizza", "end_article": "Ancient Egypt"}}, ...]"""

          body = json.dumps({
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.9,
          }).encode()

          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=body,
              headers={
                  "Authorization": f"Bearer {OPENAI_KEY}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req) as r:
                  resp = json.loads(r.read())
          except urllib.error.HTTPError as e:
              print(f"OpenAI error {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)

          raw_content = resp["choices"][0]["message"]["content"].strip()

          # Strip markdown code fences if the model included them
          if raw_content.startswith("```"):
              raw_content = raw_content.split("```")[1]
              if raw_content.startswith("json"):
                  raw_content = raw_content[4:]

          try:
              pairs = json.loads(raw_content)
          except json.JSONDecodeError as e:
              print(f"Failed to parse OpenAI response as JSON: {e}", file=sys.stderr)
              print(f"Raw response:\n{raw_content}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(pairs, list):
              print(f"Expected a JSON array, got: {type(pairs)}", file=sys.stderr)
              sys.exit(1)

          # ── 4. Validate deduplication client-side as a safety net ────────────
          used_set = {
              (p["start"].lower(), p["end"].lower()) for p in used_pairs
          }
          clean_pairs = []
          skipped = []
          for pair in pairs:
              key = (pair["start_article"].lower(), pair["end_article"].lower())
              if key in used_set:
                  skipped.append(pair)
              else:
                  used_set.add(key)  # prevent duplicates within the new batch too
                  clean_pairs.append(pair)

          if skipped:
              print(f"Skipped {len(skipped)} duplicate(s): {skipped}")

          if not clean_pairs:
              print("No new unique pairs generated — exiting without insert.", file=sys.stderr)
              sys.exit(1)

          # ── 5. Assign dates and insert ───────────────────────────────────────
          puzzles = []
          for i, pair in enumerate(clean_pairs):
              d = start_date + datetime.timedelta(days=i)
              puzzles.append({
                  "date": d.isoformat(),
                  "start_article": pair["start_article"],
                  "end_article": pair["end_article"],
              })

          body = json.dumps(puzzles).encode()
          req = urllib.request.Request(
              f"{SUPABASE_URL}/rest/v1/daily_puzzles",
              data=body,
              method="POST",
              headers={
                  **SUPABASE_HEADERS,
                  "Prefer": "resolution=ignore-duplicates",
              },
          )

          try:
              with urllib.request.urlopen(req) as r:
                  print(f"✓ Inserted {len(puzzles)} puzzles ({start_date} → {puzzles[-1]['date']})")
                  for p in puzzles:
                      print(f"  {p['date']}: {p['start_article']} → {p['end_article']}")
          except urllib.error.HTTPError as e:
              print(f"Supabase insert error {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)
          PYEOF
